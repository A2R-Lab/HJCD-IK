name: Tests

# HJCD-IK requires a CUDA GPU to build and run. Until a self-hosted GPU runner is
# registered, this workflow is manual-only; flip the `push` trigger on once the
# `[self-hosted, gpu]` runner exists.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  test:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # GRiD + GLASS

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nlohmann-json3-dev

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,codegen]'

      - name: grid.cuh freshness check
        run: |
          python scripts/codegen/check_grid_cuh_fresh.py

      - name: Full correctness suite
        run: python -m pytest tests -v
