name: Tests

# HJCD-IK requires a CUDA GPU to build and run. Until a self-hosted GPU runner is
# registered, this workflow is manual-only; flip the `push` trigger on once the
# `[self-hosted, gpu]` runner exists.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  test:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # GRiD + GLASS

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libeigen3-dev nlohmann-json3-dev

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
          pip install -r tests/requirements.txt || true

      - name: grid.cuh freshness check
        run: |
          python scripts/check_grid_cuh_fresh.py

      - name: Build (CMake + pybind via pip)
        run: python -m pip install -e .

      - name: Regression tests (vs committed baseline)
        run: pytest tests/test_regression.py -v

      - name: FK-equivalence tests
        run: pytest tests/test_fk_equivalence.py -v
