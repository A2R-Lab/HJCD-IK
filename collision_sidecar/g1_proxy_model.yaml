# G1 compact collision proxy model (spheres + capsules), link-local frames.
# Source of truth for the sidecar; build_collision_sidecar.py (no --seed) reads THIS.
# primitive_count: 34
# TUNED (apply_tuning.py) -- documented edits:
#   * logo_link:*  REMOVED -- logo_link is the decorative chest logo; MuJoCo never collides it (per-pair both=0). It only produced false positives against the arms.
#   * left/right_shoulder_yaw  proximal (shoulder-MOUNT) end pulled back to 60% -- the mount nests against the torso at neutral (false positive); the retained distal end is the UPPER-ARM segment, which still catches real arm-torso collisions when the arm swings in (both stays >0). Torso proxy is left at full size so arm-torso collisions are NOT under-covered.
#   * left/right_elbow  distal end pulled back to 55% length -- the elbow proxy covers the upper forearm near the elbow; the wrist cluster covers the distal forearm. Removes the neutral overlap with wrist_pitch (both=0 -- never a real collision).
#   * left/right_wrist_pitch  shortened to 55% length, r x0.8 -- small link near the hand; the shrink separates it from the elbow proxy at neutral without missing wrist/hand collisions (those show up as wrist_yaw/hand vs body, still covered).
#   * base_link:broad  ADDED -- conservative pelvis broad-phase capsule; the pelvis SDF (g1_pelvis_sdf.npz) is the narrow phase for base_link<->limb pairs (1C).
