[build-system]
requires = [
  "scikit-build-core>=0.9.0",
  "pybind11>=2.11",
  "numpy>=1.17.4",
  "sympy>=1.7.1",
  "beautifulsoup4>=4.9.3",
  "lxml>=4.2.1",
]
build-backend = "scikit_build_core.build"

[project]
name = "hjcdik"
version = "0.0.1"
description = "Minimal Python bindings for hjcdik (C++/CUDA)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Cael Yasutake" },
  { name = "Andrew H. Liu" },
  { name = "Zachary Kingston" },
  { name = "Brian Plancher", email = "plancher@dartmouth.edu" },
]

# REQUIRED runtime + codegen dependencies
dependencies = [
  "numpy>=1.17.4",
  "sympy>=1.7.1",
  "beautifulsoup4>=4.9.3",
  "lxml>=4.2.1",
]

# OPTIONAL extras. Base install stays lightweight (HJCD-IK needs none of these). The competitor
# baselines are heavy and skippable — see docs/source/user_guide/benchmarks/results.rst.
[project.optional-dependencies]
# Lightweight tooling + PyRoki's pure-python friends that pip CAN resolve. The solver stacks
# themselves (PyRoki, cuRobo) and their JAX-CUDA / torch deps are NOT plain-PyPI installs — run
# scripts/setup/install_baselines.sh, which installs this extra and then the git/source solvers.
baselines = [
  "pyyaml>=5.4",                # goal_file / world yaml parsing
  "pandas>=1.3",                # baseline results CSV
  "tabulate>=0.8",              # console summary tables
  "jaxlie>=1.4",                # SE3/SO3 pose-error metrics (PyRoki path)
  "yourdfpy>=0.0.56",           # URDF load (PyRoki path)
  "robot_descriptions>=1.10",   # panda_description (PyRoki path)
]
plots = [
  "matplotlib>=3.5",   # benchmark/plot_pareto.py (Figs 4/5). make_tables.py needs nothing extra.
]
dev = [
  "pytest>=7.0",
  "scipy>=1.7",
  "pytest-gpu-proof>=0.1.0",   # signed GPU-proof receipt gen/verify (PyPI; was a submodule). Needs Python >=3.11.
  "pyyaml>=5.4",               # read the YAML policy (tests/gpu-proof-policy.yaml); pytest-gpu-proof doesn't pull it in
]

[tool.scikit-build]
cmake.version = ">=3.23"
build-dir = "build"
# The committed csrc/generated/grid.cuh is the build default; regenerate it explicitly
# with scripts/codegen/generate_grid.py (or build with -DHJCDIK_AUTO_CODEGEN=ON to regenerate here).
cmake.define.HJCDIK_AUTO_CODEGEN = "OFF"
# Copy the package directory wholesale, so the generated metadata sidecar
# (hjcdik/hjcd_targets.json) ships as package data alongside the .py files. hjcdik.joint_names() /
# target_names() read it via importlib.resources and fail loudly if it is absent, so a wheel built
# without it is broken at import-adjacent call time rather than silently name-less.
wheel.packages = ["hjcdik"]
sdist.include = ["hjcdik/hjcd_targets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu_proof: Test outcomes recorded in the signed pytest-gpu-proof receipt (auto-applied to the whole suite by tests/conftest.py; every HJCD-IK test drives the CUDA kernel).",
]

[tool.gpu_proof]
# GPU tests run locally on a real GPU; the signed receipt (gpu-proof.json) is
# verified in CPU-only CI via github.com/plancherb1.keys. See scripts/setup/run_gpu_proof.sh.
mode = "local"
output = "gpu-proof.json"
github_username = "plancherb1"     # org remotes (A2R-Lab) carry no SSH keys — sign as the keyholder
required_marker = "gpu_proof"
# Fingerprint the test harness only. The code under test — the CUDA kernel and the
# GRiD/GLASS submodules — is pinned by the parent tree's commit + gitlinks, which the
# fingerprinter cannot descend into; the verifier's commit-SHA check invalidates the
# receipt on any kernel or pin change, forcing a re-run.
fingerprint_paths = ["tests"]
max_age_days = 30
require_gpu = true
