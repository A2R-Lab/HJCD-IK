# Ancestor commits are accepted only when this complete source manifest still matches.
# Pin the scope in policy too: a producer must not narrow it through CLI options.
min_schema: 3
allow_dirty: false
max_age_days: 30
required_fingerprint_paths: [csrc, hjcdik, tests, benchmark, scripts, examples, docs/source, README.md, CMakeLists.txt, pyproject.toml, .gitmodules, external]
required_fingerprint_extra_paths: []
required_fingerprint_excluded_paths: [gpu-proof.json]
required_test_manifest: tests/gpu-proof-tests.txt
